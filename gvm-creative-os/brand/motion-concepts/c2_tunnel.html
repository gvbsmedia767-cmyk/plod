<script type="module">
// Concept C v2 — «Монтажное пространство»: real GVM works (posters from gvbsmedia.ru) hung in dark space as rounded frames; the camera flies through and lands on the logo.
import * as THREE from 'three';
const W=1280,H=720,r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setPixelRatio(1);r.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(r.domElement);
const BG='#0b0b0d',scene=new THREE.Scene();scene.background=new THREE.Color(BG);scene.fog=new THREE.Fog(BG,5,24);
const cam=new THREE.PerspectiveCamera(48,W/H,.1,100);
const works=[['kit-clinic-poster','КЛИНИКА · ИМИДЖЕВЫЙ ФИЛЬМ'],['bath-way-poster','«ЧУГУН ХОЛЛ» · REELS'],['portfolio-main-001-arwad-light-commercial-poster','ARWAD · РЕКЛАМА'],['dance-performance-poster','ТАНЕЦ · ПЕРФОРМАНС'],['wedding-vows-poster','СВАДЬБА · КЛЯТВЫ'],['barber','БАРБЕРШОП · CINEMATIC'],['directing-showreel-poster','РЕЖИССУРА · ШОУРИЛ'],['elena-ai-expert-2026-poster','ЭКСПЕРТ · REELS 2026'],['gvbs-hero-desktop-poster','ОБЪЕКТ · ДРОН'],['about-gvbs-poster','О СТУДИИ']];
function load(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src=src})}
function rounded(img,label,idx){const s=900/Math.max(img.width,img.height),w=Math.round(img.width*s),h=Math.round(img.height*s),pad=0;const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 const R=Math.min(w,h)*.06;x.beginPath();x.roundRect(0,0,w,h,R);x.clip();x.drawImage(img,0,0,w,h);
 const g=x.createLinearGradient(0,h*.6,0,h);g.addColorStop(0,'#0000');g.addColorStop(1,'#000a');x.fillStyle=g;x.fillRect(0,0,w,h);
 x.font=`500 ${Math.round(Math.min(w,h)*.045)}px "Martian Mono"`;x.fillStyle='#f2efe8';x.fillText(label,R*.9,h-R*.9);
 x.fillStyle='#ff5a1f';x.fillText('● '+String(idx+1).padStart(2,'0'),w-R*.9-x.measureText('● 00').width,R*1.6);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return [t,w/h]}
function label(text,size,color,weight,fam){const c=document.createElement('canvas');c.width=2400;c.height=480;const x=c.getContext('2d');x.fillStyle=color;x.font=`${weight} ${size}px ${fam}`;x.textBaseline='middle';x.fillText(text,10,240);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
window.ready=(async()=>{await document.fonts.ready;await document.fonts.load('900 100px Unbounded','ОДИН КАДР');await document.fonts.load('500 20px "Martian Mono"','КЛИНИКА OMSK GVBSMEDIA.RU 0123');
 for(let i=0;i<14;i++){const [name,lab]=works[i%works.length];const img=await load('works/'+name+'.jpg');const [tex,ar]=rounded(img,lab,i%works.length);
  const h=ar<1?2.7:1.75,w=h*ar;const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  const side=i%2?1:-1,z=-1.5-i*2.5;m.position.set(side*(1.45+(i%3)*.3),((i*37)%5-2)*.32,z);m.rotation.y=-side*.42;m.rotation.z=side*.02;scene.add(m)}
 [['ОДИН',-5],['КАДР',-13],['МЕНЯЕТ',-21],['ВСЁ.',-29]].forEach(([w,z],k)=>{const s=new THREE.Mesh(new THREE.PlaneGeometry(9,1.8),new THREE.MeshBasicMaterial({map:label(w,300,k==3?'#ff5a1f':'#f2efe8',900,'Unbounded'),transparent:true,depthWrite:false}));s.position.set(-1.9,-.1,z);scene.add(s)});
 const img=await load('gvm-logo-paper.svg');const c=document.createElement('canvas');c.width=1600;c.height=1120;c.getContext('2d').drawImage(img,0,0,1600,1120);
 const lt=new THREE.CanvasTexture(c);lt.colorSpace=THREE.SRGBColorSpace;const L=new THREE.Mesh(new THREE.PlaneGeometry(4.4,3.08),new THREE.MeshBasicMaterial({map:lt,transparent:true}));L.position.set(0,.15,-40);scene.add(L);
 const tc=new THREE.Mesh(new THREE.PlaneGeometry(9,1.8),new THREE.MeshBasicMaterial({map:label('OMSK 55°N · GVBSMEDIA.RU',110,'#9a978f',500,'"Martian Mono"'),transparent:true}));tc.position.set(-.9,-2.05,-40);tc.scale.set(.42,.42,.42);scene.add(tc)})();
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
window.render=t=>{const p=ease(Math.min(1,t/6.2));const z=4-p*38.6;cam.position.set(Math.sin(t*.9)*.55*(1-p),Math.sin(t*.7)*.22*(1-p),z);cam.lookAt(Math.sin(t*.5)*.35*(1-p),0,z-6);cam.rotation.z=Math.sin(t*.8)*.045*(1-p);r.render(scene,cam)};
</script></body></html>
