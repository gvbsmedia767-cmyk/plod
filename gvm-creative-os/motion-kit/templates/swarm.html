<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#050506;overflow:hidden}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js"}}</script>
<script type="module">
// «Световой рой»: light particles swarm, lock into the first phrase, burst and re-form into the second.
// Params: width, height, first:[{text,size,y}], second:[{text,size,y,weight?}], formAt, burstAt, reformAt, count
import * as THREE from 'three';
const P=Object.assign({width:1280,height:720,count:60000,formAt:.9,burstAt:3.5,reformAt:4.1,
 first:[{text:'ХОЧЕТСЯ',size:.15,y:.42},{text:'СМОТРЕТЬ',size:.12,y:.65}],second:[{text:'GVM',size:.28,y:.47},{text:'GOOD VIBES MEDIA',size:.036,y:.82,weight:500}]},window.GVM_PARAMS||{});
const W=P.width,H=P.height,N=P.count,A=W/H;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setPixelRatio(1);document.body.appendChild(r.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,A,.1,100);
const span=2*9.8*Math.tan(THREE.MathUtils.degToRad(20))*A*.84; // text spans 84% of the visible width at the hold distance
function sample(lines){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';
 for(const l of lines){let px=l.size*W,f=`${l.weight||900} ${px}px ${l.weight&&l.weight<800?'Onest':'Unbounded'}`;x.font=f;const m=x.measureText(l.text).width;if(m>W*.92){px*=W*.92/m;x.font=`${l.weight||900} ${px}px ${l.weight&&l.weight<800?'Onest':'Unbounded'}`}x.fillText(l.text,W/2,l.y*H)}
 const d=x.getImageData(0,0,W,H).data,pts=[],st=Math.max(1,Math.round(W/640));for(let y=0;y<H;y+=st)for(let k=0;k<W;k+=st)if(d[(y*W+k)*4]>128)pts.push([(k-W/2)/W*span,-(y-H/2)/W*span]);
 const out=new Float32Array(N*3);for(let i=0;i<N;i++){const p=pts[(i*7919)%pts.length];out[i*3]=p[0]+(Math.random()-.5)*.02;out[i*3+1]=p[1]+(Math.random()-.5)*.02;out[i*3+2]=(Math.random()-.5)*.06}return out}
let S=[];const g=new THREE.BufferGeometry(),pos=new Float32Array(N*3),col=new Float32Array(N*3),seed=new Float32Array(N),cloud=new Float32Array(N*3);
for(let i=0;i<N;i++){seed[i]=Math.random();const a=Math.random()*6.283,rr=3+Math.random()*9,z=-20+Math.random()*30;cloud[i*3]=Math.cos(a)*rr*Math.max(1,A);cloud[i*3+1]=Math.sin(a)*rr*.6/Math.min(1,A);cloud[i*3+2]=z}
g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.055*Math.min(1,A*1.4),vertexColors:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false})));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,cl=x=>Math.max(0,Math.min(1,x));
const hot=new THREE.Color('#ff5a1f'),warm=new THREE.Color('#ffd7a3'),cool=new THREE.Color('#7fb4ff');
window.ready=(async()=>{const txt=[...P.first,...P.second].map(l=>l.text).join('');await document.fonts.load('900 100px Unbounded',txt);await document.fonts.load('500 40px Onest',txt);S=[sample(P.first),sample(P.second)]})();
window.render=t=>{const f1=ease(cl((t-P.formAt)/1.6)),burst=cl((t-P.burstAt)/.6),f2=ease(cl((t-P.reformAt)/1.4));
 for(let i=0;i<N;i++){const s=seed[i],k=i*3,sw=t*.6+s*20;
  const cx=cloud[k]+Math.sin(sw+cloud[k+1])*.8,cy=cloud[k+1]+Math.cos(sw*1.3+cloud[k])*.6,cz=cloud[k+2]+((t*3+s*30)%30)-15;
  let x=cx+(S[0][k]-cx)*f1,y=cy+(S[0][k+1]-cy)*f1,z=cz+(S[0][k+2]-cz)*f1;
  const bx=x+(x*.8+Math.sin(s*50)*3)*burst,by=y+(y*.8+Math.cos(s*70)*3)*burst,bz=z+(s-.5)*14*burst;
  x=bx+(S[1][k]-bx)*f2;y=by+(S[1][k+1]-by)*f2;z=bz+(S[1][k+2]-bz)*f2;pos[k]=x;pos[k+1]=y;pos[k+2]=z;
  const settle=Math.max(f1*(1-burst),f2),c=s<.12?cool:(s<.55?hot:warm),fl=.55+.75*settle;col[k]=c.r*fl;col[k+1]=c.g*fl;col[k+2]=c.b*fl}
 g.attributes.position.needsUpdate=true;g.attributes.color.needsUpdate=true;
 cam.position.set(Math.sin(t*.35)*1.8*Math.min(1,A),Math.cos(t*.3)*.6,12-2.2*Math.max(f1*(1-burst),f2));cam.lookAt(0,0,0);r.render(scene,cam)};
</script></body></html>
