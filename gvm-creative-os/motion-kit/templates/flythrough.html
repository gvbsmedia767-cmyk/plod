<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#0b0b0d;overflow:hidden}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js"}}</script>
<script type="module">
// «Монтажное пространство»: real works hang in dark space as rounded frames; the camera flies through and lands on the logo.
// Params: width, height, duration, works:[{img (path from templates/), label}], words:[...], accentLast, logo, tagline
import * as THREE from 'three';
const P=Object.assign({width:1280,height:720,duration:7,works:[],words:['ОДИН','КАДР','МЕНЯЕТ','ВСЁ.'],accentLast:true,logo:'../assets/gvm-logo-paper.svg',tagline:'OMSK 55°N · GVBSMEDIA.RU'},window.GVM_PARAMS||{});
const W=P.width,H=P.height,A=W/H,portrait=A<1;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setPixelRatio(1);r.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(r.domElement);
const BG='#0b0b0d',scene=new THREE.Scene();scene.background=new THREE.Color(BG);scene.fog=new THREE.Fog(BG,portrait?3:5,portrait?12:24);
const cam=new THREE.PerspectiveCamera(portrait?70:48,A,.1,100);
const load=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('image not found: '+src));i.src=src});
function rounded(img,label,idx){const s=900/Math.max(img.width,img.height),w=Math.round(img.width*s),h=Math.round(img.height*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 const R=Math.min(w,h)*.06;x.beginPath();x.roundRect(0,0,w,h,R);x.clip();x.drawImage(img,0,0,w,h);
 const g=x.createLinearGradient(0,h*.6,0,h);g.addColorStop(0,'#0000');g.addColorStop(1,'#000a');x.fillStyle=g;x.fillRect(0,0,w,h);
 x.font=`500 ${Math.round(Math.min(w,h)*.045)}px "Martian Mono"`;x.fillStyle='#f2efe8';x.fillText(label||'',R*.9,h-R*.9);
 x.fillStyle='#ff5a1f';const n='● '+String(idx+1).padStart(2,'0');x.fillText(n,w-R*.9-x.measureText(n).width,R*1.6);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return [t,w/h]}
function label(text,size,color,weight,fam,center){const c=document.createElement('canvas');c.width=2400;c.height=480;const x=c.getContext('2d');x.fillStyle=color;x.font=`${weight} ${size}px ${fam}`;x.textBaseline='middle';if(center){x.textAlign='center';x.fillText(text,1200,240)}else x.fillText(text,10,240);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const END=-40;
window.ready=(async()=>{const txt=P.works.map(w=>w.label).join('')+P.words.join('')+P.tagline;await document.fonts.load('900 100px Unbounded',txt);await document.fonts.load('500 20px "Martian Mono"',txt);
 const n=Math.max(P.works.length,1),count=14,gap=(-END-6)/count;
 for(let i=0;i<count&&P.works.length;i++){const wk=P.works[i%n];const img=await load(wk.img);const [tex,ar]=rounded(img,wk.label,i%n);
  const h=(ar<1?2.7:1.75)*(portrait?.8:1),w=h*ar;const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  const side=i%2?1:-1,z=-1.5-i*gap;
  if(portrait)m.position.set(side*.55,(i%2?1:-1)*(1.4+(i%3)*.35),z);else m.position.set(side*(1.45+(i%3)*.3),((i*37)%5-2)*.32,z);
  m.rotation.y=portrait?0:-side*.42;m.rotation.x=portrait?side*.35:0;scene.add(m)}
 const step=(-END-10)/Math.max(1,P.words.length);
 P.words.forEach((w,k)=>{const last=k===P.words.length-1;const s=new THREE.Mesh(new THREE.PlaneGeometry(9,1.8),new THREE.MeshBasicMaterial({map:label(w,300,last&&P.accentLast?'#ff5a1f':'#f2efe8',900,'Unbounded',portrait),transparent:true,depthWrite:false}));
  s.position.set(portrait?0:-1.9,-.1,-5-k*step);if(portrait)s.scale.set(.45,.45,.45);scene.add(s)});
 const img=await load(P.logo);const c=document.createElement('canvas');c.width=1600;c.height=1120;c.getContext('2d').drawImage(img,0,0,1600,1120);
 const lt=new THREE.CanvasTexture(c);lt.colorSpace=THREE.SRGBColorSpace;const L=new THREE.Mesh(new THREE.PlaneGeometry(4.4,3.08),new THREE.MeshBasicMaterial({map:lt,transparent:true}));L.position.set(0,.15,END);if(portrait)L.scale.set(.62,.62,.62);scene.add(L);
 const tc=new THREE.Mesh(new THREE.PlaneGeometry(9,1.8),new THREE.MeshBasicMaterial({map:label(P.tagline,110,'#9a978f',500,'"Martian Mono"',portrait),transparent:true}));tc.position.set(portrait?0:-.9,portrait?-1.4:-2.05,END);tc.scale.setScalar(portrait?.27:.42);scene.add(tc)})();
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
window.render=t=>{const p=ease(Math.min(1,t/(P.duration-.8)));const z=4-p*(4-END-5.4);cam.position.set(Math.sin(t*.9)*.55*(1-p),Math.sin(t*.7)*.22*(1-p),z);cam.lookAt(Math.sin(t*.5)*.35*(1-p),0,z-6);cam.rotation.z=Math.sin(t*.8)*.045*(1-p);r.render(scene,cam)};
</script></body></html>
